<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Pilot - 飛行專注鐘</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --text-main: #66fcf1;
            --text-accent: #ff9900;
            --text-dim: #c5c6c7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .cockpit-panel {
            background-color: var(--panel-bg);
            border: 2px solid #45a29e;
            border-radius: 15px;
            padding: 40px;
            width: 350px;
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.15);
            text-align: center;
        }

        h1 {
            font-size: 20px;
            color: var(--text-accent);
            letter-spacing: 2px;
            margin-top: 0;
            text-transform: uppercase;
        }

        .status {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 20px;
            height: 20px;
        }

        .timer-display {
            font-size: 72px;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(102, 252, 241, 0.5);
            line-height: 1;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #0b0c10;
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--text-accent);
            transition: width 1s linear;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        button {
            background-color: var(--bg-color);
            color: var(--text-dim);
            border: 1px solid var(--text-dim);
            padding: 10px 15px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease-in-out;
            flex: 1;
            margin: 0 5px;
        }

        button:hover {
            color: var(--bg-color);
            background-color: var(--text-main);
            border-color: var(--text-main);
            box-shadow: 0 0 10px var(--text-main);
        }

        .btn-primary {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        .log-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #45a29e;
            font-size: 14px;
        }

        .log-section span {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-accent);
        }
    </style>
</head>
<body>

    <div class="cockpit-panel">
        <h1>✈️ Focus Pilot</h1>
        <div class="status" id="status-text">SYS: STANDBY</div>
        
        <div class="timer-display" id="timer">25:00</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div class="btn-group">
            <button onclick="setMode(25, 'SYS: STANDARD FLIGHT')">Flight (25m)</button>
            <button onclick="setMode(5, 'SYS: SHORT LAYOVER')">Rest (5m)</button>
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="startTimer()">Takeoff</button>
            <button onclick="pauseTimer()">Hold</button>
            <button onclick="resetTimer()">Abort</button>
        </div>

        <div class="log-section">
            Total Flight Log: <br>
            <span id="total-time">0</span> Minutes
        </div>
    </div>

    <script>
        let timerInterval;
        let totalSeconds = 25 * 60;
        let timeRemaining = totalSeconds;
        let isRunning = false;
        
        // 讀取 localStorage 中的飛行紀錄
        let totalFlightMinutes = parseInt(localStorage.getItem('flightLogMins')) || 0;
        document.getElementById('total-time').innerText = totalFlightMinutes;

        const timerDisplay = document.getElementById('timer');
        const progressBar = document.getElementById('progress');
        const statusText = document.getElementById('status-text');

        function updateDisplay() {
            let minutes = Math.floor(timeRemaining / 60);
            let seconds = timeRemaining % 60;
            timerDisplay.innerText = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // 更新進度條
            let progressPercentage = ((totalSeconds - timeRemaining) / totalSeconds) * 100;
            progressBar.style.width = progressPercentage + '%';
        }

        function setMode(minutes, statusMsg) {
            if (isRunning) pauseTimer();
            totalSeconds = minutes * 60;
            timeRemaining = totalSeconds;
            statusText.innerText = statusMsg;
            statusText.style.color = 'var(--text-main)';
            updateDisplay();
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            statusText.innerText = "SYS: EN ROUTE...";
            statusText.style.color = 'var(--text-accent)';
            
            timerInterval = setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    updateDisplay();
                } else {
                    clearInterval(timerInterval);
                    isRunning = false;
                    statusText.innerText = "SYS: ARRIVED";
                    
                    // 只有在完成 25 分鐘飛行時才記錄時間
                    if (totalSeconds === 25 * 60) {
                        totalFlightMinutes += 25;
                        localStorage.setItem('flightLogMins', totalFlightMinutes);
                        document.getElementById('total-time').innerText = totalFlightMinutes;
                        alert("Flight Completed! 總飛行時數已更新。");
                    } else {
                        alert("Layover Completed! 準備下一趟飛行。");
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            if(timeRemaining > 0) {
                statusText.innerText = "SYS: HOLDING PATTERN";
                statusText.style.color = 'var(--text-dim)';
            }
        }

        function resetTimer() {
            pauseTimer();
            timeRemaining = totalSeconds;
            statusText.innerText = "SYS: FLIGHT ABORTED";
            statusText.style.color = 'red';
            updateDisplay();
        }

        // 初始化畫面
        updateDisplay();
    </script>
</body>
</html>
